# Illustration: replace aliases with two disposable DNF 4/systemd SSH targets.
# Configure non-root SSH aliases, host trust, and passwordless sudo first.
tags:
  example:
    services:
      vmango-repository: {state: present}
      vmango: {state: present}
    order: 10
    vars:
      vmango:
        listen: "127.0.0.1:18080"
        log_level: info
      vmango_repository:
        target: rhel-10
services:
  vmango-repository:
    file: ../vmango/services/repository.yaml
  vmango:
    file: ../vmango/services/vmango.yaml
hosts:
  - name: first
    tags: [example]
    transport: {type: ssh, host: richt-test-a, sudo: true}
  - name: second
    tags: [example]
    transport: {type: ssh, host: richt-test-b, sudo: true}
