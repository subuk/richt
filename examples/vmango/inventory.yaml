# Local execution example: disposable AlmaLinux 10 x86_64, root, DNF 4, systemd.
tags:
  example:
    services:
      vmango-repository: {state: present}
      vmango: {state: present}
    order: 10
    vars:
      vmango:
        listen: "127.0.0.1:18080"
        log_level: info
      vmango_repository:
        target: rhel-10
services:
  vmango-repository:
    file: services/repository.yaml
  vmango:
    file: services/vmango.yaml
hosts:
  - name: localhost
    tags: [example]
    transport: {type: local}
