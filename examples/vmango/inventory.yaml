# Local execution example: disposable AlmaLinux 10 x86_64, root, DNF 4, systemd.
tags:
  example:
    weight: 10
    vars:
      vmango:
        listen: "127.0.0.1:18080"
        log_level: info
      vmango_repository:
        target: rhel-10
services:
  vmango-repository:
    file: services/repository.yaml
  vmango:
    file: services/vmango.yaml
hosts:
  - name: localhost
    tags: [example]
    transport: {type: local}
    services:
      - {name: vmango-repository, order: 10}
      - {name: vmango, order: 20}
