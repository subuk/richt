binaries:
  package:
    type: rpm
    manager: dnf
    package: vmango

configs:
  main:
    path: /etc/vmango.conf
    owner: root
    group: vmango
    mode: "0640"
    template:
      file: ../templates/vmango.conf.gotmpl

processes:
  web:
    type: systemd
    unit: vmango.service
    state: running
    enabled: true
    timeout: 5s
    restart_on: [binary.package, config.main]
