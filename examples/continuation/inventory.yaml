tags:
  example:
    services:
      first: {state: present}
      second: {state: present}
      third: {state: present}
# README.md allocates a fresh directory and substitutes this target prefix.
services:
  first:
    order: 10
    configs:
      - name: main
        path: /var/tmp/richt-continuation-example/first.conf
        mode: "0644"
        template: {inline: "step=first\n"}
  second:
    order: 20
    configs:
      - name: main
        path: /var/tmp/richt-continuation-example/blocked/second.conf
        mode: "0644"
        template: {inline: "step=second\n"}
  third:
    order: 30
    configs:
      - name: main
        path: /var/tmp/richt-continuation-example/third.conf
        mode: "0644"
        template: {inline: "step=third\n"}
hosts:
  - name: localhost
    tags: [example]
    transport: {type: local}
