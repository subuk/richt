secret_sources:
  default: {type: yaml, file: default.yaml}
  production: {type: yaml, file: production.yaml}
services:
  application:
    configs:
      credentials:
        path: /var/tmp/richt-secret-example/app.conf
        mode: "0600"
        sensitive: false
        template: {file: app.conf.gotmpl}
hosts:
  - name: localhost
    transport: {type: local}
    services:
      - {name: application, order: 10, state: present}
