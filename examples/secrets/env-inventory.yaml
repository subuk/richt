tags:
  example:
    services:
      application: {state: present}
secret_sources:
  default:
    type: env
    env:
      credential.password: RICHT_EXAMPLE_PASSWORD
      optional: RICHT_EXAMPLE_EMPTY
      message: RICHT_EXAMPLE_MULTILINE
  yaml: {type: yaml, file: default.yaml}
  unused:
    type: env
    env: {unused.key: RICHT_EXAMPLE_MISSING}
services:
  application:
    order: 10
    configs:
      - name: credentials
        path: /var/tmp/richt-env-secret-example/app.conf
        mode: "0600"
        sensitive: false
        template: {file: env-app.conf.gotmpl}
hosts:
  - name: localhost
    tags: [example]
    transport: {type: local}
