services:
  repository:
    configs:
      repo:
        path: /etc/yum.repos.d/richt-demo.repo
        mode: "0644"
        template:
          inline: |
            [richt-demo]
            name=Richt demonstration repository
            baseurl=file:///var/lib/richt-demo-fixture/repo
            enabled=1
            gpgcheck=0
  demo:
    binaries:
      app:
        type: rpm
        manager: dnf
        package: richt-demo
        version: 0:1.0-1.noarch
    configs:
      main:
        path: /etc/richt-demo.conf
        mode: "0644"
        template:
          inline: |
            message=hello
    processes:
      main:
        type: systemd
        unit: richt-demo.service
        state: running
        enabled: true
        timeout: 5s
        restart_on: [binary.app]
        reload_on: [config.main]
        # This owned drop-in proves reload capability before the RPM exists.
        overrides:
          20-reload.conf:
            template:
              inline: |
                [Service]
                ExecReload=
                ExecReload=/bin/kill -HUP $MAINPID
hosts:
  - name: isolated
    transport: {type: local}
    services:
      - {name: repository, order: 10}
      - {name: demo, order: 20}
